name: CI
on:
  push: { branches: [main] }
  pull_request:

permissions: { contents: read }

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      REPINTEL_ENV: test
      REPINTEL_JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      REPINTEL_COOKIE_SECURE: "false"
      REPINTEL_DATABASE_URL: postgresql+psycopg://repintel_app:repintel_app@localhost:5432/repintel
      REPINTEL_MIGRATION_DATABASE_URL: postgresql+psycopg://repintel_owner:repintel_owner@localhost:5432/repintel
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with: { python-version: "3.12" }
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Create roles and database
        run: |
          psql -v ON_ERROR_STOP=1 -f ../infra/postgres/init-roles.sql
          ../infra/postgres/create-db.sh repintel
      - name: Migrations are reversible
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
      - name: Database-level tenant isolation (RLS)
        run: |
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_isolation.sql)
          echo "$out"
          echo "$out" | grep -q "ALL RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_user_tables.sql)
          echo "$out"
          echo "$out" | grep -q "ALL USER-TABLE RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_monitoring.sql)
          echo "$out"
          echo "$out" | grep -q "ALL MONITORING RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_collection.sql)
          echo "$out"
          echo "$out" | grep -q "ALL COLLECTION RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_nlp.sql)
          echo "$out"
          echo "$out" | grep -q "ALL NLP RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_intelligence.sql)
          echo "$out"
          echo "$out" | grep -q "ALL INTELLIGENCE RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_browser.sql)
          echo "$out"
          echo "$out" | grep -q "ALL BROWSER RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_agents.sql)
          echo "$out"
          echo "$out" | grep -q "ALL AGENT RLS TESTS PASSED"
          out=$(PGPASSWORD=repintel_app psql -h localhost -U repintel_app -d repintel -X \
                -v ON_ERROR_STOP=1 -f tests/sql/test_rls_billing.sql)
          echo "$out"
          echo "$out" | grep -q "ALL BILLING RLS TESTS PASSED"
      - name: Headless Chromium for PDF reports
        run: uv run playwright install --with-deps chromium
      - name: API tests
        run: uv run pytest -v
      - name: Backup and restore round-trip (server's PostgreSQL 16 tools, as in production)
        working-directory: .
        run: |
          docker run --rm --network host -v "$PWD:/w" -w /w -e PGHOST -e PGUSER -e PGPASSWORD \
            pgvector/pgvector:pg16 bash -euo pipefail -c '
              f=$(BACKUP_DIR=/tmp/backups PGDATABASE=repintel scripts/backup.sh)
              scripts/restore.sh "$f" repintel_restore
              ! scripts/restore.sh "$f" repintel_restore     # refuses a non-empty target
            '
          q="SELECT (SELECT count(*) FROM pg_tables WHERE schemaname='public'),
                    (SELECT count(*) FROM pg_class WHERE relforcerowsecurity),
                    (SELECT count(*) FROM pg_policies), (SELECT version_num FROM alembic_version),
                    (SELECT count(*) FROM plans), (SELECT count(*) FROM connector_policies)"
          a=$(psql -XtA -d repintel -c "$q"); b=$(psql -XtA -d repintel_restore -c "$q")
          echo "source:   $a"; echo "restored: $b"; test "$a" = "$b"
          PGPASSWORD=repintel_app psql -XtA -h localhost -U repintel_app -d repintel_restore \
            -c "SELECT count(*) FROM plans" | grep -qx 7

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: if [ -f package-lock.json ]; then npm ci; else npm install; fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  images:
    # The production images build on every push (not pushed anywhere), so a broken
    # Dockerfile is caught before a release.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: false
          load: ${{ matrix.component == 'backend' }}
          tags: repintel-${{ matrix.component }}:ci
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
      - name: Chromium starts inside the backend image
        if: matrix.component == 'backend'
        run: |
          docker run --rm --shm-size=256m repintel-backend:ci python -c "
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(); pg = b.new_page()
              pg.set_content('<p dir=rtl>مرحبا</p>'); print(len(pg.pdf())); b.close()"
