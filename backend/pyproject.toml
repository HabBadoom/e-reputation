[project]
name = "repintel-backend"
version = "0.1.0"
description = "Reputation intelligence platform — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.32",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "cryptography>=45",
    "pyjwt>=2.9",
    "redis>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
# Seed INSERTs are built from module constants (fixed keys + uuid5), never from input.
"migrations/*" = ["E501", "S608"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
